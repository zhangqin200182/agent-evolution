[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rllm"
version = "0.1.0"
description = "Agent RL training with tool-use environments"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.45.0",
    "datasets",
    "pandas",
    "pyarrow",
]

[project.optional-dependencies]
trl = ["trl>=0.12.0", "accelerate>=0.34.0", "peft"]
verl = ["verl>=0.2.0", "vllm>=0.6.0"]
remote = ["pyyaml"]
all = ["rllm[trl,verl,remote]", "wandb", "tensorboard"]

[tool.setuptools.packages.find]
include = ["rllm_common*", "rllm_train*", "rllm_verl*", "rllm_remote*"]
